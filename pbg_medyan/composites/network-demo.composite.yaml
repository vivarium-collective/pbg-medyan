name: network-demo
description: "Minimal MEDYAN-style actomyosin network: a handful of seeded actin filaments treadmilling under a Brownian-ratchet boundary force. Emits the core scalar network metrics each step."
tags: [cytoskeleton, polymers, mechanics, demo]

requires:
  processes: [MedyanProcess, RAMEmitter]

parameters:
  interval:
    type: float
    default: 1.0
    description: "Process interval in seconds. MedyanProcess subdivides each interval into n_substeps mechanochemical steps."
  n_filaments:
    type: int
    default: 5
    description: "Initial number of seeded actin filaments."
  rng_seed:
    type: int
    default: 42
    description: "Integer seed for reproducibility (0 = nondeterministic)."

state:
  cytoskeleton:
    _type: process
    address: "local:MedyanProcess"
    config:
      box_size: 1.0
      n_filaments: "${n_filaments}"
      initial_filament_length: 0.25
      actin_concentration: 4.0
      n_motors: 0
      n_crosslinks: 0
      rng_seed: "${rng_seed}"
    inputs: {}
    outputs:
      n_filaments: ["stores", "n_filaments"]
      n_motors: ["stores", "n_motors"]
      n_crosslinks: ["stores", "n_crosslinks"]
      total_length: ["stores", "total_length"]
      mean_filament_length: ["stores", "mean_filament_length"]
      network_span: ["stores", "network_span"]
      radius_of_gyration: ["stores", "radius_of_gyration"]
      bending_energy: ["stores", "bending_energy"]
      stretch_energy: ["stores", "stretch_energy"]
      total_energy: ["stores", "total_energy"]
      membrane_area: ["stores", "membrane_area"]
      membrane_volume: ["stores", "membrane_volume"]
      membrane_mean_radius: ["stores", "membrane_mean_radius"]
      membrane_bending_energy: ["stores", "membrane_bending_energy"]
    interval: "${interval}"
  stores: {}
  emitter:
    _type: step
    address: "local:RAMEmitter"
    config:
      emit:
        n_filaments: "float"
        total_length: "float"
        mean_filament_length: "float"
        network_span: "float"
        radius_of_gyration: "float"
        total_energy: "float"
    inputs:
      n_filaments: ["stores", "n_filaments"]
      total_length: ["stores", "total_length"]
      mean_filament_length: ["stores", "mean_filament_length"]
      network_span: ["stores", "network_span"]
      radius_of_gyration: ["stores", "radius_of_gyration"]
      total_energy: ["stores", "total_energy"]
