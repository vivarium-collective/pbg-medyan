name: network-demo-with-viz
description: "MEDYAN-style network demo with a wired Visualization Step. Each update produces a Plotly HTML figure of the running scalar network metrics, written to the 'viz_html' store."

requires:
  processes: [MedyanProcess, NetworkMetricsPlots, RAMEmitter]

parameters:
  interval:
    type: float
    default: 1.0
    description: "Process interval in seconds."
  n_filaments:
    type: int
    default: 5
    description: "Initial number of seeded actin filaments."
  viz_title:
    type: string
    default: "MEDYAN network metrics"
    description: "Title displayed at the top of the Plotly figure."

state:
  cytoskeleton:
    _type: process
    address: "local:MedyanProcess"
    config:
      box_size: 1.0
      n_filaments: "${n_filaments}"
      initial_filament_length: 0.25
      actin_concentration: 4.0
      n_motors: 0
      n_crosslinks: 0
      rng_seed: 42
    inputs: {}
    outputs:
      n_filaments: ["stores", "n_filaments"]
      n_motors: ["stores", "n_motors"]
      n_crosslinks: ["stores", "n_crosslinks"]
      total_length: ["stores", "total_length"]
      mean_filament_length: ["stores", "mean_filament_length"]
      network_span: ["stores", "network_span"]
      radius_of_gyration: ["stores", "radius_of_gyration"]
      bending_energy: ["stores", "bending_energy"]
      stretch_energy: ["stores", "stretch_energy"]
      total_energy: ["stores", "total_energy"]
      membrane_area: ["stores", "membrane_area"]
      membrane_volume: ["stores", "membrane_volume"]
      membrane_mean_radius: ["stores", "membrane_mean_radius"]
      membrane_bending_energy: ["stores", "membrane_bending_energy"]
    interval: "${interval}"
  stores:
    viz_html: ""
  viz:
    _type: step
    address: "local:NetworkMetricsPlots"
    config:
      title: "${viz_title}"
    inputs:
      n_filaments: ["stores", "n_filaments"]
      total_length: ["stores", "total_length"]
      mean_filament_length: ["stores", "mean_filament_length"]
      network_span: ["stores", "network_span"]
      radius_of_gyration: ["stores", "radius_of_gyration"]
      total_energy: ["stores", "total_energy"]
      time: ["global_time"]
    outputs:
      html: ["stores", "viz_html"]
  emitter:
    _type: step
    address: "local:RAMEmitter"
    config:
      emit:
        n_filaments: "float"
        total_length: "float"
        mean_filament_length: "float"
        network_span: "float"
        radius_of_gyration: "float"
        total_energy: "float"
    inputs:
      n_filaments: ["stores", "n_filaments"]
      total_length: ["stores", "total_length"]
      mean_filament_length: ["stores", "mean_filament_length"]
      network_span: ["stores", "network_span"]
      radius_of_gyration: ["stores", "radius_of_gyration"]
      total_energy: ["stores", "total_energy"]
